<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="600" y2="800">
      <stop offset="0%" style="stop-color:#E11D48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F43F5E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="400" y2="500">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.85" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="800" fill="url(#bgGradient)"/>

  <!-- Decoración de círculos -->
  <circle cx="100" cy="100" r="150" fill="white" opacity="0.1"/>
  <circle cx="500" cy="700" r="120" fill="white" opacity="0.08"/>
  <circle cx="450" cy="200" r="80" fill="white" opacity="0.12"/>

  <!-- Mockup de tarjeta de espacio -->
  <g transform="translate(100, 200)">
    <!-- Tarjeta -->
    <rect x="0" y="0" width="400" height="400" rx="24" fill="url(#cardGradient)" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.3))"/>

    <!-- Imagen del espacio -->
    <rect x="20" y="20" width="360" height="240" rx="16" fill="#F1F5F9"/>

    <!-- Iconos de amenidades -->
    <circle cx="60" cy="140" r="30" fill="#E11D48" opacity="0.9"/>
    <circle cx="200" cy="100" r="25" fill="#F43F5E" opacity="0.8"/>
    <circle cx="320" cy="160" r="35" fill="#E11D48" opacity="0.85"/>

    <!-- Texto simulado -->
    <rect x="20" y="280" width="200" height="20" rx="4" fill="#1E293B" opacity="0.8"/>
    <rect x="20" y="310" width="150" height="14" rx="4" fill="#64748B" opacity="0.6"/>

    <!-- Rating stars -->
    <circle cx="20" cy="350" r="8" fill="#FCD34D"/>
    <circle cx="40" cy="350" r="8" fill="#FCD34D"/>
    <circle cx="60" cy="350" r="8" fill="#FCD34D"/>
    <circle cx="80" cy="350" r="8" fill="#FCD34D"/>
    <circle cx="100" cy="350" r="8" fill="#E5E7EB"/>

    <!-- Precio -->
    <rect x="280" y="340" width="100" height="30" rx="8" fill="#E11D48" opacity="0.9"/>
  </g>

  <!-- Logo/Branding -->
  <g transform="translate(250, 680)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
      Balconazo
    </text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.9" text-anchor="middle">
      Descubre espacios únicos
    </text>
  </g>
</svg>

