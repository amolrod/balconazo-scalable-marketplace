<!-- Modal Backdrop -->
<div class="modal-backdrop modal-backdrop-enter" (click)="onBackdropClick($event)">
  <!-- Modal Content -->
  <div
    class="modal-content modal-content-enter"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'dialog-title'"
  >
    <!-- Header -->
    <div class="modal-header">
      <h2 id="dialog-title" class="modal-title">{{ title }}</h2>
      <button
        type="button"
        class="btn-icon btn-ghost modal-close"
        (click)="onCancel()"
        aria-label="Cerrar"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <p class="modal-message">{{ message }}</p>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onCancel()"
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        [class]="'btn btn-' + confirmType"
        (click)="onConfirm()"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
